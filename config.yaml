providers:
  aitunnel:
    name: AITUNNEL
    base_url: https://api.aitunnel.ru/v1
    key_env: AITUNNEL_API_KEY

  neuralgate:
    name: NEURALGATE
    base_url: https://api.neuralgate.ru/v1
    key_env: NEURALGATE_API_KEY
    # Единый сетевой шлюз нейросетей: одна подписка покрывает все модели, без OpenRouter-кредитов.
    # Ключ в env NEURALGATE_API_KEY (или CUSTOM_API_KEY / OPENAI_API_KEY / OPENROUTER_API_KEY).

  softhive:
    name: SOFTHIVE (via Groq)
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    # Каталог SoftHive.ru: карточка «Llama 3.3-70B (Groq)» — бесплатный API-эндпоинт,
    # без привязки карты, работает из РФ. Другие карточки SoftHive (Mistral и т.д.)
    # добавляются в этот же раздел. 
  echo:
    base_url: http://127.0.0.1:8899/v1
    extra_headers:
      X-Echo-Test: abc
    name: echo
  ovh:
    extra_headers:
      Authorization: Bearer
    name: OVHcloud anon
    base_url: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
  blockrun:
    name: BlockRun
    base_url: https://blockrun.ai/api/v1
  llm7:
    name: LLM7
    base_url: https://api.llm7.io/v1
  pollinations:
    name: Pollinations
    base_url: https://text.pollinations.ai/openai
  jarvisclaw:
    name: JarvisClaw
    base_url: https://api.jarvisclaw.ai/v1
    extra_headers:
      Authorization: ''
  freeai:
    name: Free.ai
    base_url: https://api.free.ai/v1
  kilo:
    name: Kilo Gateway
    base_url: https://api.kilo.ai/api/gateway
    extra_headers:
      Authorization: ''
  flm:
    name: flm
    base_url: https://flm.stonech.at/v1
