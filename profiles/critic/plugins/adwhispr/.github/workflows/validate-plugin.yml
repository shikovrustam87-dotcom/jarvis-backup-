name: Validate Hermes plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: plugin

      - name: Check out Hermes validator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: NousResearch/hermes-agent
          ref: f128052e51e40264d146df44b5e72b4a47be4b5e
          path: hermes-agent

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Validate JSON
        run: |
          jq -e . plugin/plugin.json >/dev/null
          jq -e . plugin/mcp.json >/dev/null

      - name: Validate with Hermes
        shell: bash
        run: |
          set -o pipefail
          pip install -e hermes-agent
          hermes plugins validate --install-deps plugin </dev/null | tee validate.log
          # Catalog review: the server must stay untrusted so write tools prompt.
          grep -q "server trust: adwhispr.*untrusted" validate.log

      - name: Every skill has a matching name
        run: |
          for d in plugin/skills/*/; do
            n=$(basename "$d")
            grep -q "^name: $n$" "$d/SKILL.md" || { echo "name mismatch in $d"; exit 1; }
          done

      - name: Reject client-specific setup instructions
        run: |
          if grep -RniE 'Cursor Settings|\.cursor/|Claude Code: run|Cowork' plugin/skills; then
            echo "Client-specific instructions found in portable skills"
            exit 1
          fi
